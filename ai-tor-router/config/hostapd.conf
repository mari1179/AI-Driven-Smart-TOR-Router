# ── Hostapd — Wi-Fi Access Point Configuration ────────────────────────────
# IMPORTANT: Change SSID and passphrase before deploying!

# Wi-Fi interface (USB adapter — usually wlan1 on Pi)
interface=wlan1

# Use nl80211 driver (standard for modern adapters)
driver=nl80211

# Network name (SSID)
ssid=SecureNet

# Country code (change to your country)
country_code=IN

# Wi-Fi channel
channel=6

# 802.11 mode: g = 2.4GHz, a = 5GHz
hw_mode=g

# WPA2 security
wpa=2
wpa_passphrase=changeme123
wpa_key_mgmt=WPA-PSK
wpa_pairwise=TKIP
rsn_pairwise=CCMP

# Enable IEEE 802.11n (faster speeds)
ieee80211n=1
wmm_enabled=1

# Hide SSID (optional — set to 1 to hide)
ignore_broadcast_ssid=0

# Max clients
max_num_sta=10
