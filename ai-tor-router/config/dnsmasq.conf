# ── Dnsmasq — DHCP & DNS for Hotspot ─────────────────────────────────────

# Listen only on the hotspot interface
interface=wlan1
bind-interfaces

# Don't use /etc/resolv.conf (we route DNS through Tor)
no-resolv

# Forward DNS queries to Tor's DNSPort
server=127.0.0.1#5353

# DHCP range for connected clients
dhcp-range=192.168.4.2,192.168.4.20,255.255.255.0,24h

# Router (Pi's IP on hotspot interface)
dhcp-option=3,192.168.4.1

# DNS (Pi itself)
dhcp-option=6,192.168.4.1

# Log queries (optional — helps with debugging)
log-queries
log-facility=/var/log/dnsmasq.log
